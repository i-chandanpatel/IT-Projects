<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sweden Flag</title>
    <style>
        #container{
            background-color: yellow;
            height: 200px;
            width: 300px;
            position: relative;
        }
        .box{
            box-sizing: border-box;
            background-color: blue;
        }
        .first, .third{
            height: 85px;
            width: 85px;
        }
        .third{
            position: absolute;
            bottom: 0px;
        }

        .second, .fourth{
            height: 85px;
            width: 170px;
            position: absolute;
        }

        .second{
            top: 0px;
            right: 0px;
        }
        .fourth{
            bottom: 0px;
            right: 0px;
        }
    </style>
</head>
<body style="background-color: black;">
    <div id="container">
        <div class="box first"></div>
        <div class="box second"></div>
        <div class="box third"></div>
        <div class="box fourth"></div>
    </div>
</body>
</html>
