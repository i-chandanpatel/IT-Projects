<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Grid</title>
    <style>
        *{
            padding: 0px;
            margin: 0px;
            box-sizing: border-box;
            
        }
        body{
            height: 100vh;
            background-color: black;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container{
            height: 70vh;
            width: 40vw;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr 1fr 1fr 1fr 1fr;
            grid-template-rows: repeat(8,1fr);
        }
        .white{
            background-color: white;
        }
        .brown{
            background-color: brown;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="white"></div>
        <div class="brown"></div>
        <div class="white"></div>
        <div class="brown"></div>
        <div class="white"></div>
        <div class="brown"></div>
        <div class="white"></div>
        <div class="brown"></div>
        <div class="brown"></div>
        <div class="white"></div>
        <div class="brown"></div>
        <div class="white"></div>
        <div class="brown"></div>
        <div class="white"></div>
        <div class="brown"></div>
        <div class="white"></div>

        <div class="brown"></div>

        <div class="brown"></div>
        <div class="white"></div>
        <div class="brown"></div>
        <div class="brown"></div>
        <div class="white"></div>
        <div class="brown"></div>
        <div class="white"></div>
        <div class="brown"></div>
        <div class="white"></div>
        <div class="brown"></div>
        <div class="white"></div>
        <div class="white"></div>
        <div class="brown"></div>
        <div class="white"></div>
        <div class="brown"></div>

        <div class="brown"></div>

        <div class="brown"></div>

        <div class="white"></div>

    </div>
</body>
</html>
