<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Email & Password Validator</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* Basic Reset */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: "Poppins", sans-serif;
  background: linear-gradient(135deg, #3e5e58, #acb6e5);
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.container {
  background: #fff;
  padding: 2rem;
  border-radius: 10px;
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
  width: 350px;
}

h1 {
  text-align: center;
  margin-bottom: 1.5rem;
  color: #333;
}

.input-group {
  margin-bottom: 1.2rem;
  display: flex;
  flex-direction: column;
}

label {
  margin-bottom: 0.5rem;
  font-weight: 600;
}

input {
  padding: 0.8rem;
  border: 1px solid #ccc;
  border-radius: 5px;
  font-size: 1rem;
  transition: all 0.3s ease;
}

input:focus {
  border-color: #6a11cb;
  outline: none;
  box-shadow: 0 0 4px rgba(106, 17, 203, 0.2);
}

.error-message {
  color: #e63946;
  font-size: 0.85rem;
  display: none;
  margin-top: 0.3rem;
}

button {
  width: 100%;
  padding: 0.9rem;
  background: #6a11cb;
  color: white;
  border: none;
  border-radius: 5px;
  font-size: 1rem;
  cursor: pointer;
  transition: background 0.3s ease;
}

button:hover {
  background: #2575fc;
}

  </style>
</head>
<body>

  <div class="container">
    <h1>Email & Password Validator</h1>
    <form autocomplete="off" id="validatorForm" novalidate>
      
      <div class="input-group">
        <label for="email">Email</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          placeholder="Enter your email" 
          required
        />
        <small class="error-message" id="emailerror">Please enter a valid email.</small>
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          placeholder="Enter your password" 
          required
        />
        <small class="error-message" id="passworderror">Password must be at least 8 characters.</small>
      </div>

      <button type="submit">Validate</button>
    </form>
  </div>

</body>
<script>
let email=document.querySelector("#email");
let pass=document.querySelector("#password");
let form =document.querySelector("form");

form.addEventListener("submit", (dts)=>{
    dts.preventDefault();
    document.querySelector("#emailerror").textContent="";
    document.querySelector("#passworderror").textContent="";
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/;

    let emails=emailRegex.test(email.value);
    let passwords=passwordRegex.test(pass.value);

    if(!emails){
        document.querySelector("#emailerror").textContent="Email type incorrect";
        document.querySelector(".error-message").style.display="initial";
    }
    if(!passwords){
        document.querySelector("#passworderror").textContent="Password type incorrect";
        document.querySelector("#passworderror").style.display="initial";
    }
})

</script>
</html>
