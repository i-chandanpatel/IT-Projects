<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adaptive Theme</title>
  <style>
    .light {
      background-color: white;
      color: black;
      transition: all 0.3s ease;
    }
    .dark {
      background-color: black;
      color: white;
      transition: all 0.3s ease;
    }
    .container {
      text-align: center;
      padding: 50px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body class="light">
  <div class="container">
    <h1>Theme Preference</h1>
    <button id="toggleTheme">Toggle Theme</button>
  </div>

  <script>
    // =============================
    // Function: Apply system theme
    // =============================
    function setDarkorLight() {
      if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.body.classList.add("dark");
        document.body.classList.remove("light");
      } else {
        document.body.classList.add("light");
        document.body.classList.remove("dark");
      }
    }

    // ============================================================
    // STEP 1: Check if a theme was previously saved in localStorage
    // ============================================================
    const savedTheme = localStorage.getItem("theme");
    if (savedTheme) {
      // If found, apply the saved theme instead of system preference
      document.body.classList.add(savedTheme);
      document.body.classList.remove(savedTheme === "dark" ? "light" : "dark");
    } else {
      // Otherwise, apply the theme based on system preference
      setDarkorLight();
    }

    // ============================================================
    // STEP 2: Handle manual toggle and save selection
    // ============================================================
    document.querySelector("#toggleTheme").addEventListener("click", () => {
      if (document.body.classList.contains("light")) {
        // Switch to dark mode
        document.body.classList.add("dark");
        document.body.classList.remove("light");
        // Save theme preference in local storage
        localStorage.setItem("theme", "dark");
      } else {
        // Switch to light mode
        document.body.classList.add("light");
        document.body.classList.remove("dark");
        localStorage.setItem("theme", "light");
      }
    });

    // ============================================================
    // STEP 3: Listen for system theme change and auto-update
    // ============================================================
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener("change", () => {
      // Only change automatically if user hasn't manually set a preference
      if (!localStorage.getItem("theme")) {
        setDarkorLight();
      }
    });

    // ============================================================
    // NOTE:
    // - sessionStorage: Keeps theme until tab is closed.
    // - localStorage: Keeps theme permanently (even after closing browser).
    // - You can clear saved preference using localStorage.removeItem("theme");
    // ============================================================
  </script>
</body>
</html>
