<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Shadow</title>
    <style>
        .container{
            margin: 50px;
            height: 200px;
            width: 200px;
            background-color: aqua;
            /* box-shadow: 10px -10px blue; */
            box-shadow: 9px -9px 20px 10px black;
            border-radius: 3px;
            /* Inset and outset property */
        }
    </style>
</head>
<body>
    <div class="container"></div>
</body>
</html>
