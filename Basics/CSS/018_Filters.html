<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filters</title>
    <style>
        /* Set a consistent height for all images */
        img {
            height: 200px;
        }

        /* Applies a blur effect of 5 pixels */
        #img2 {
            filter: blur(5px);
        }

        /* Increases brightness to 190% (1.9 times brighter) */
        #img3 {
            filter: brightness(190%);
        }

        /* Increases contrast to 120% (more distinction between dark and light areas) */
        #img4 {
            filter: contrast(120%);
        }

        /* Converts the image to grayscale (black and white) */
        #img5 {
            filter: grayscale(100%);
        }

        /*
            Only the last 'filter' is applied due to override.
            The hue-rotate is overwritten by drop-shadow.
            To apply both, they must be combined in one filter.
        */
        #img6 {
            /* filter: hue-rotate(90deg); */  /* This line is overridden */
                         /* offset-x -y blur-radius color */
            filter: drop-shadow(18px 18px 15px red) hue-rotate(90deg); /* Applies a red shadow with offset and blur */
        }

        /* Applies two filters: invert colors and reduce opacity to 0.6 */
        #img7 {
            filter: invert(1) opacity(0.6); /* invert(1) = full color inversion */
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Blurred image -->
        <img id="img2" src="https://upload.wikimedia.org/wikipedia/commons/8/84/Mozilla_Firefox_3.5_logo.png" alt="">

        <!-- Original (unfiltered) image -->
        <img id="img1" src="https://upload.wikimedia.org/wikipedia/commons/8/84/Mozilla_Firefox_3.5_logo.png" alt="">

        <!-- Brightened image -->
        <img id="img3" src="https://upload.wikimedia.org/wikipedia/commons/8/84/Mozilla_Firefox_3.5_logo.png" alt="">

        <!-- Higher contrast image -->
        <img id="img4" src="https://upload.wikimedia.org/wikipedia/commons/8/84/Mozilla_Firefox_3.5_logo.png" alt="">

        <!-- Grayscale (black & white) image -->
        <img id="img5" src="https://upload.wikimedia.org/wikipedia/commons/8/84/Mozilla_Firefox_3.5_logo.png" alt="">

        <!-- Drop shadow applied (hue-rotate was overridden) -->
        <img id="img6" src="https://upload.wikimedia.org/wikipedia/commons/8/84/Mozilla_Firefox_3.5_logo.png" alt="">

        <!-- Inverted colors with partial opacity -->
        <img id="img7" src="https://upload.wikimedia.org/wikipedia/commons/8/84/Mozilla_Firefox_3.5_logo.png" alt="">
    </div>
</body>
</html>
