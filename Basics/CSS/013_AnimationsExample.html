<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        div {
            background-color: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.29);
            padding: 10px;
            color: white;
            width: 70%;
            font-size: 30px;
            white-space: nowrap;
            overflow: hidden;
        }
        p{
            animation-name: move;
            animation-duration: 5s;
            animation-iteration-count: infinite;
            margin-left: 100%;
        }
        @keyframes move {
            from{
                margin-left: 100%;
            }
            to{
                margin-left: -100%;
            }
        }
    </style>
</head>

<body style="background-color:#0a0a0a; display: flex; justify-content: center; padding-top: 30px;">
    <div>
        <p>Animation example in CSS</p>
    </div>
</body>

</html>
