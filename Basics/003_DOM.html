<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: black;
            color: azure;
        }
    </style>
</head>
<body>
    <h1 class="a">DOM</h1>
    <ul>
        <li>Li 1</li>
        <li>Li 2</li>
        <li>Li 3</li>
        <li>Li 4</li>
        <li><a href="https://facebook.com">Link</a></li>
    </ul>
    <p id="1" class="a">Paragraph</p>
</body>

<script>
    // Selecting element by id (id is "1")
    var a = document.getElementById(1);

    // childNodes → NodeList (includes elements, text nodes, comments, whitespace)
    console.log(document.body.childNodes);

    // children → HTMLCollection (only element nodes)
    console.log(document.body.children);

    // firstChild → may be a text node (whitespace/newline)
    console.log(document.body.firstChild);

    // firstElementChild → always an element
    console.log(document.body.firstElementChild);

    // nextSibling → next node (could be text node)
    console.log(document.body.firstElementChild.nextSibling);

    // nextElementSibling → next element only
    console.log(document.body.firstChild.nextElementSibling);

    // lastChild → may be text node
    console.log(document.body.lastChild);

    // previousElementSibling → previous element only
    console.log(document.body.lastElementChild.previousElementSibling);

    // previousSibling → previous node (could be text)
    console.log(document.body.lastChild.previousSibling);

    // getElementsByClassName returns an HTMLCollection (live, element-only, array-like)
    a = document.getElementsByClassName("a");
    console.log(...a);

    // Manipulation using HTMLCollection
    for (const node of a) {
        console.log(node.innerHTML);    // includes HTML tags
        console.log(node.innerText);    // visible text only
        console.log(node.textContent);  // all text including hidden
    }

    // getElementsByTagName returns an HTMLCollection
    console.log(document.getElementsByTagName("p"));

    // querySelector with numeric id needs attribute selector
    // console.log(document.querySelector("#1")); // invalid CSS selector
    console.log(document.querySelector('[id="1"]'));

    // querySelector returns the FIRST matching element
    console.log(document.querySelector(".a"));
    console.log(document.querySelector("li"));

    // querySelectorAll returns a NodeList (static, array-like)
    console.log(document.querySelectorAll("li"));

    // Selecting anchor tag (HTMLCollection → index required)
    a = document.getElementsByTagName("a")[0];
    a.href = "https://google.com";

    console.log(a.getAttribute("href"));

    a.setAttribute("href","https://youtube.com");
    console.log(a.getAttribute("href"));
    
    // Removing href attribute
    a.removeAttribute("href");
    console.log(a);

    // Adding href again
    a.setAttribute("href","https://youtube.com");
    console.log(a);

    // Creating new element dynamically
    var h1 = document.createElement("h1");
    h1.textContent = "Dynamically Added";

    // append → adds element at the end of body
    // prepend → would add at the beginning
    document.body.append(h1);

    // Changing inline CSS using JS
    h1.style.color = "blue";
    h1.style.backgroundColor = "green";

    // getElementsByClassName returns a LIVE HTMLCollection
    a = document.getElementsByClassName("a");
    console.log(a);

    // Removing class "a" from paragraph
    a[1].classList.toggle("a");

    // Paragraph disappears from collection because HTMLCollection is LIVE
    console.log(a);
</script>
</html>
