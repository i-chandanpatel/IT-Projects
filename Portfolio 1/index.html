<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Website</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="main-container">
        <div class="sidebar">

            <!-- Profile -->
            <div class="profile">
                <img src="" alt="">
                <h2>Chandan Patel</h2>
                <p>Frontend Developer</p>
            </div>

            <!-- Contact -->
            <div class="contact">
                <div class="email">
                    <h3 class="label">Email</h3>
                    <a class="value" href="mailto:chandanpatel@gmail.com">chandanpatel@gmail.com</a>
                </div>
                <div class="phone">
                    <h3 class="label">Phone</h3>
                    <a class="value" href="tel:+91 8824">8824</a>
                </div>
                <div class="location">
                    <h3 class="label">Location</h3>
                    <p class="value">Gurugram, Haryana</p>
                </div>
            </div>

            <!-- Social Media -->
            <div class="social">
                <a href="http://www.github.com/i-chandanpatel"><img src="https://simpleicons.org/icons/github.svg"
                        alt=""></a>
                <a href="http://"><img src="https://www.svgrepo.com/show/93637/linkedin-logo.svg" alt=""></a>
            </div>

        </div>


        <div class="main-content">
            <!-- Navigation -->
             <div class="navigation">
                <nav>
                    <a href="#about" class="active" >About</a>
                    <a href="#skills">Skills</a>
                    <a href="#education">Education</a>
                    <a href="#portfolio">Portfolio</a>
                </nav>

             </div>
            <!-- About me -->
             <div id="about">
                <h2 class="heading">About me</h2>
                <div class="line"></div>
                <p class="content">I am a creative and passionate Frontend Developer</p>
             </div>
            <!-- Skils -->
             <div id="skills">
                <h2 class="heading">My Skills</h2>
                <div class="line"></div>
                <div class="grid-container">
                    <div class="item">
                        <img src="https://simpleicons.org/icons/html5.svg" alt="">
                        <h3>HTML5</h3>
                    </div>
                    <div class="item">
                        <img src="https://simpleicons.org/icons/css.svg" alt="">
                        <h3>CSS3</h3>
                    </div>
                    <div class="item">
                        <img src="https://simpleicons.org/icons/javascript.svg" alt="">
                        <h3>JavaScript</h3>
                    </div>
                    <div class="item">
                        <img src="https://simpleicons.org/icons/react.svg" alt="">
                        <h3>React</h3>
                    </div>
                    <div class="item">
                        <img src="https://simpleicons.org/icons/git.svg" alt="">
                        <h3>Git & Github</h3>
                    </div>
                    <div class="item">
                        <img src="https://simpleicons.org/icons/typescript.svg" alt="">
                        <h3>Typescript</h3>
                    </div>
                </div>
             </div>
             
            <!-- Eduaction -->
             <div id="education"></div>
            <!-- Portfolio -->
             <div id="portfolio"></div>

        </div>
    </div>
</body>

</html>
